services:
  db:
    image: postgis/postgis:16-3.4
    container_name: blood_response_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bloodapp
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: blood_response
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: